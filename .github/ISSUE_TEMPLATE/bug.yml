name: Bug report
description: Report a reproducible parser, graph, packaging, or MCP problem.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private BSL source, credentials, or undisclosed security details.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal synthetic BSL and the tool call that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
